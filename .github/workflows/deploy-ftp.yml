name: Deploy Incremental via Rsync SSH ke Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, rsync, dan migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal dependensi frontend
        run: npm ci

      - name: Build Tailwind CSS dan JavaScript
        run: npm run build

      - name: Pastikan hasil build tersedia
        run: test -f public/build/manifest.json

      - name: Hapus penanda Vite development
        run: rm -f public/hot

      # -----------------------------------------------------------------
      # Upload via Rsync over SSH (Menggantikan FTP yang sering terputus)
      # Mempertahankan file storage (gambar/foto upload) & .env di server
      # -----------------------------------------------------------------
      - name: Upload perubahan via Rsync
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_TARGET: ${{ secrets.SSH_APP_PATH || '/home/clouwkvx/public_html/pintar_aset' }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          sshpass -e rsync -avz --delete \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=5" \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude '.env*' \
            --exclude 'storage/app/public/**' \
            --exclude 'storage/app/**' \
            --exclude 'storage/framework/cache/**' \
            --exclude 'storage/framework/sessions/**' \
            --exclude 'storage/framework/views/**' \
            --exclude 'storage/logs/**' \
            --exclude 'bootstrap/cache/**' \
            --exclude 'public/storage' \
            --exclude 'tests' \
            ./ "$SSH_USER@$SSH_HOST:$SSH_TARGET/"

      # -----------------------------------------------------------------
      # Jalankan Migration, Autoload Class/Service Baru, dan Clear Cache
      # -----------------------------------------------------------------
      - name: Jalankan migration dan autoload service baru
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '21098' }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="${{ secrets.SSH_APP_PATH || '/home/clouwkvx/public_html/pintar_aset' }}"

            if [ ! -f "$APP_DIR/artisan" ]; then
              echo "ERROR: Folder artisan tidak ditemukan di $APP_DIR"
              exit 1
            fi

            echo "Aplikasi Laravel ditemukan di: $APP_DIR"
            cd "$APP_DIR"

            # Pastikan symbolic link storage untuk upload foto/gambar sudah terhubung
            if [ ! -L "public/storage" ]; then
              php artisan storage:link || true
            fi

            # Siapkan Composer untuk dump-autoload service baru
            COMPOSER_CMD=""
            if command -v composer >/dev/null 2>&1; then
              COMPOSER_CMD="composer"
            else
              for CBIN in /opt/cpanel/composer/bin/composer /usr/local/bin/composer "$HOME/composer.phar" ./composer.phar; do
                if [ -f "$CBIN" ]; then
                  COMPOSER_CMD="php $CBIN"
                  break
                fi
              done
            fi

            if [ -z "$COMPOSER_CMD" ]; then
              echo "composer tidak ditemukan, mengunduh composer.phar sementara..."
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --install-dir=. --filename=composer.phar
              php -r "@unlink('composer-setup.php');"
              COMPOSER_CMD="php composer.phar"
            fi

            echo "Regenerasi autoloader Composer..."
            $COMPOSER_CMD dump-autoload --optimize --no-interaction --no-scripts

            echo "Menjalankan database migration..."
            php artisan migrate --force --no-interaction

            echo "Membersihkan dan memperbarui cache konfigurasi/route..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache