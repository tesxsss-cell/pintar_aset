name: Deploy Incremental via FTPS ke Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build dan sinkronkan file yang berubah
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Periksa migration baru
        id: migration_check
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          CURRENT="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BEFORE="$(git rev-parse HEAD^)"
            else
              BEFORE=""
            fi
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            MIGRATIONS="$(git ls-files 'database/migrations/*.php')"
          else
            MIGRATIONS="$(git diff --name-only --diff-filter=A "$BEFORE" "$CURRENT" -- 'database/migrations/*.php')"
          fi

          if [ -n "$MIGRATIONS" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration baru ditemukan:"
            echo "$MIGRATIONS"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada migration baru. Proses migrate dilewati."
          fi

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal dependensi frontend
        run: npm ci

      - name: Build Tailwind CSS dan JavaScript
        run: npm run build

      - name: Pastikan hasil build tersedia
        run: test -f public/build/manifest.json

      - name: Hapus penanda Vite development
        run: rm -f public/hot

      - name: Upload perubahan via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          log-level: verbose
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            *.log
            **/*.log
            .DS_Store
            **/.DS_Store
            .env
            .env.backup
            .env.production
            .phpactor.json
            .phpunit.result.cache
            .codex/**
            .cursor/**
            .idea/**
            .nova/**
            .phpunit.cache/**
            .vscode/**
            .zed/**
            auth.json
            node_modules/**
            **/node_modules/**
            vendor/**
            **/vendor/**
            _ide_helper.php
            **/_ide_helper.php
            public/fonts-manifest.dev.json
            public/hot
            public/hot/**
            public/storage
            public/storage/**
            storage/*.key
            storage/pail/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/**
            bootstrap/cache/**
            Homestead.json
            **/Homestead.json
            Homestead.yaml
            **/Homestead.yaml
            Thumbs.db
            **/Thumbs.db
            tests/**

      # Hanya berjalan jika ada file migration baru.
      - name: Jalankan migration baru di server
        if: steps.migration_check.outputs.has_migrations == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            cd /home/clouyogf/public_html/pos
            php artisan migrate --force --no-interaction
            php artisan optimize:clear
