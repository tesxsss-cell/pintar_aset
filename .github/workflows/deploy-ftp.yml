name: Deploy Incremental via FTPS ke Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cegah dua deployment menulis ke production secara bersamaan.
concurrency:
  group: deploy-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build dan sinkronkan file yang berubah
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci memakai package-lock.json agar hasil instalasi konsisten.
      - name: Instal dependensi frontend
        run: npm ci

      # Menghasilkan aset production ke public/build.
      - name: Build Tailwind CSS dan JavaScript
        run: npm run build

      - name: Pastikan hasil build tersedia
        run: test -f public/build/manifest.json

      - name: Hapus penanda Vite development
        run: rm -f public/hot

      # File .ftp-deploy-sync-state.json disimpan di server.
      # public/build sengaja tidak dikecualikan agar hasil build ikut diunggah.
      - name: Upload perubahan via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          log-level: verbose

          # Akun FTP harus memiliki root ke folder deployment:
          # /home/clouyogf/public_html/pos
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            *.log
            **/*.log
            .DS_Store
            **/.DS_Store
            .env
            .env.backup
            .env.production
            .phpactor.json
            .phpunit.result.cache
            .codex/**
            .cursor/**
            .idea/**
            .nova/**
            .phpunit.cache/**
            .vscode/**
            .zed/**
            auth.json
            node_modules/**
            **/node_modules/**
            vendor/**
            **/vendor/**
            _ide_helper.php
            **/_ide_helper.php
            public/fonts-manifest.dev.json
            public/hot
            public/hot/**
            public/storage
            public/storage/**
            storage/*.key
            storage/pail/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/**
            bootstrap/cache/**
            Homestead.json
            **/Homestead.json
            Homestead.yaml
            **/Homestead.yaml
            Thumbs.db
            **/Thumbs.db
            tests/**
