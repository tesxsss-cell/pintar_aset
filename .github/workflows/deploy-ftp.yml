name: Deploy Incremental via FTPS ke Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, upload, dan migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal dependensi frontend
        run: npm ci

      - name: Build Tailwind CSS dan JavaScript
        run: npm run build

      - name: Pastikan hasil build tersedia
        run: test -f public/build/manifest.json

      - name: Hapus penanda Vite development
        run: rm -f public/hot

      - name: Upload perubahan via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          log-level: verbose
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            *.log
            **/*.log
            .DS_Store
            **/.DS_Store
            .env
            .env.backup
            .env.production
            .phpactor.json
            .phpunit.result.cache
            .codex/**
            .cursor/**
            .idea/**
            .nova/**
            .phpunit.cache/**
            .vscode/**
            .zed/**
            auth.json
            node_modules/**
            **/node_modules/**
            vendor/**
            **/vendor/**
            _ide_helper.php
            **/_ide_helper.php
            public/fonts-manifest.dev.json
            public/hot
            public/hot/**
            public/storage
            public/storage/**
            storage/*.key
            storage/pail/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/**
            bootstrap/cache/**
            Homestead.json
            **/Homestead.json
            Homestead.yaml
            **/Homestead.yaml
            Thumbs.db
            **/Thumbs.db
            tests/**

      # Langkah ini selalu dijalankan setelah upload.
      # Laravel hanya menjalankan migration yang belum tercatat di database.
      # Jika tidak ada migration baru, hasilnya "Nothing to migrate" dan
      # tidak ada perubahan pada database.
      - name: Periksa dan jalankan migration pending
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '21098' }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="${{ secrets.SSH_APP_PATH }}"

            if [ -z "$APP_DIR" ]; then
              for CANDIDATE in "$HOME/public_html/pos" "$HOME/public_html"; do
                if [ -f "$CANDIDATE/artisan" ]; then
                  APP_DIR="$CANDIDATE"
                  break
                fi
              done
            fi

            if [ -z "$APP_DIR" ]; then
              ARTISAN_FILE="$(find "$HOME/public_html" -maxdepth 4 -type f -name artisan -print -quit 2>/dev/null || true)"
              if [ -n "$ARTISAN_FILE" ]; then
                APP_DIR="$(dirname "$ARTISAN_FILE")"
              fi
            fi

            if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/artisan" ]; then
              echo "ERROR: Folder aplikasi Laravel tidak ditemukan."
              echo "Isi GitHub Secret SSH_APP_PATH dengan path folder yang berisi file artisan."
              echo "Contoh: /home/clourvyr/public_html/pos"
              exit 1
            fi

            echo "Aplikasi Laravel ditemukan di: $APP_DIR"
            cd "$APP_DIR"

            # Regenerasi autoloader Composer agar kelas/service baru
            # (mis. App\Services\AssetImportService, App\Support\XlsxReader)
            # langsung dikenali. Server Namecheap sering tidak punya perintah
            # "composer" global, jadi kita cari di lokasi umum; bila tetap tidak
            # ada, unduh composer.phar sementara agar dump-autoload tetap jalan.
            COMPOSER_CMD=""
            if command -v composer >/dev/null 2>&1; then
              COMPOSER_CMD="composer"
            else
              for CBIN in /opt/cpanel/composer/bin/composer /usr/local/bin/composer "$HOME/composer.phar" ./composer.phar; do
                if [ -f "$CBIN" ]; then
                  COMPOSER_CMD="php $CBIN"
                  break
                fi
              done
            fi

            if [ -z "$COMPOSER_CMD" ]; then
              echo "composer tidak ditemukan, mengunduh composer.phar sementara..."
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --install-dir=. --filename=composer.phar
              php -r "@unlink('composer-setup.php');"
              COMPOSER_CMD="php composer.phar"
            fi

            echo "Memakai composer: $COMPOSER_CMD"
            $COMPOSER_CMD dump-autoload --optimize --no-interaction --no-scripts

            php artisan migrate --force --no-interaction
            php artisan optimize:clear
